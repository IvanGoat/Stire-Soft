<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="814" viewBox="0 0 1200 814" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>Guía de metáforas — STIRE</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#7A716A"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#C87B1E"/></marker>
</defs>
<rect width="1200" height="814" fill="#FFFFFF"/>
<text x="600.0" y="42" font-size="19" fill="#2B2622" text-anchor="middle" font-weight="700" opacity="1">3.3.2 · GUÍA DE METÁFORAS — Formato 14 (MODESEC)</text>
<text x="600.0" y="66" font-size="12" fill="#7A716A" text-anchor="middle" font-weight="400" opacity="1">Metáfora rectora: EL TALLER DEL ALGORITMISTA · trazo lineal 1.5 px · sin trofeos ni medallas</text>
<rect x="24" y="88" width="1152" height="40" rx="8" fill="#F6F3EF" stroke="#C9C1B8" stroke-width="1.2"/>
<text x="44" y="113" font-size="12" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Nombre</text>
<text x="230" y="113" font-size="12" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Imagen</text>
<text x="330" y="113" font-size="12" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Descripción (función que representa el icono)</text>
<rect x="24.0" y="140" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(42.0,160)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8,30 h32 M12,30 v10 M36,30 v10 M14,30 v-6 h10 v6 M28,24 h8"/></g>
<text x="106.0" y="174" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Mi banco de trabajo</text>
<text x="106.0" y="194" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Panel del estudiante (V-01): lo que dejó a medias y</text>
<text x="106.0" y="210" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">lo que toca hoy.</text>
<rect x="600.0" y="140" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(618.0,160)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12,10 h18 l6,6 v22 h-24 z M30,10 v6 h6 M17,24 h14 M17,30 h10"/></g>
<text x="682.0" y="174" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Encargo / pieza</text>
<text x="682.0" y="194" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Ejercicio con medidas y tolerancias: entrada, salida</text>
<text x="682.0" y="210" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">y restricciones.</text>
<rect x="24.0" y="244" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(42.0,264)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10,12 h28 v24 h-28 z M20,19 l10,5 -10,5 z"/></g>
<text x="106.0" y="278" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Prueba de banco</text>
<text x="106.0" y="298" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Ejecutar sin entregar: ensayo ilimitado que no</text>
<text x="106.0" y="314" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">consume intento.</text>
<rect x="600.0" y="244" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(618.0,264)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8,20 h32 M8,20 v8 M40,20 v8 M20,20 v6 M28,20 v6 M14,32 h20 v4 h-20 z"/></g>
<text x="682.0" y="278" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Calibrador</text>
<text x="682.0" y="298" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Casos de prueba: criterio objetivo y público, no</text>
<text x="682.0" y="314" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">opinión.</text>
<rect x="24.0" y="348" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(42.0,368)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10,12 h28 v18 h-16 l-8,7 v-7 h-4 z M24,17 a3,3 0 1,1 2,5 v2 M24,27 v1"/></g>
<text x="106.0" y="382" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Maestro de taller</text>
<text x="106.0" y="402" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Tutor IA (V-04): pregunta y señala; nunca hace la</text>
<text x="106.0" y="418" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">pieza por ti.</text>
<rect x="600.0" y="348" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(618.0,368)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10,26 h28 v8 h-28 z M10,26 h8 v8 h-8 z M18,26 h8 v8 h-8 z M14,18 v4 M24,14 v8 M34,18 v4"/></g>
<text x="682.0" y="382" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Temple</text>
<text x="682.0" y="402" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Nivel de dominio (mastery): se gana con uso y se</text>
<text x="682.0" y="418" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">pierde con desuso.</text>
<rect x="24.0" y="452" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(42.0,472)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M30,14 a8,8 0 1,0 4,8 l6,6 -4,4 -6,-6 a8,8 0 0,1 -12,-4 M12,30 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0"/></g>
<text x="106.0" y="486" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Mantenimiento</text>
<text x="106.0" y="506" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Repaso espaciado SM-2: se afila antes de que se</text>
<text x="106.0" y="522" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">desafile.</text>
<rect x="600.0" y="452" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(618.0,472)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14,22 h20 v16 h-20 z M18,22 v-5 a6,6 0 0,1 12,0 v5 M24,28 v5"/></g>
<text x="682.0" y="486" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Encargo fuera de nivel</text>
<text x="682.0" y="506" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Unidad bloqueada por el grafo de prerrequisitos.</text>
<rect x="24.0" y="556" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(42.0,576)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12,10 h24 v28 h-24 z M16,10 v28 M20,18 h12 M20,24 h12 M20,30 h8"/></g>
<text x="106.0" y="590" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Bitácora</text>
<text x="106.0" y="610" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Progreso y dominio (V-06): registro de lo producido.</text>
<rect x="600.0" y="556" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(618.0,576)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10,12 h28 v24 h-28 z M16,24 l6,6 10,-12"/></g>
<text x="682.0" y="590" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Entregar</text>
<text x="682.0" y="610" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Consume intento y dispara la evaluación del juez.</text>
<rect x="24.0" y="660" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(42.0,680)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M24,10 a10,10 0 0,1 6,18 v4 h-12 v-4 a10,10 0 0,1 6,-18 M20,36 h8"/></g>
<text x="106.0" y="694" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Pedir pista</text>
<text x="106.0" y="714" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Abre al maestro de taller con el contexto del código</text>
<text x="106.0" y="730" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">actual.</text>
<rect x="600.0" y="660" width="564.0" height="92" rx="8" fill="#FFFFFF" stroke="#C9C1B8" stroke-width="1.2"/>
<g transform="translate(618.0,680)" stroke="#C87B1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M28,12 h-16 v24 h16 M24,24 h14 M32,18 l6,6 -6,6"/></g>
<text x="682.0" y="694" font-size="13" fill="#2B2622" text-anchor="start" font-weight="700" opacity="1">Cerrar sesión</text>
<text x="682.0" y="714" font-size="11.5" fill="#7A716A" text-anchor="start" font-weight="400" opacity="1">Sale del taller guardando el estado del banco.</text>
</svg>
